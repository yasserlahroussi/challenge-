<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="js19.js" defer></script>
    <style>
        .product-card {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
        }

        .product-card img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            display: block;
            background: #f1f5f9;
        }

        .product-card .body {
            padding: 10px 12px;
        }

        .product-card h3 {
            margin: 0 0 4px;
            font-size: 1rem;
        }

        .product-card .price {
            margin: 0;
            color: #1d4ed8;
            font-weight: 600;
        }
    </style>
</head>

<body>
<div id="products" class="grid"></div>
</body>

</html>
